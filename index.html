<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practice Projects | Mehmet Aytac</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="py-5 border-bottom bg-white">
        <div class="container">
            <h1 class="display-5 fw-bold mb-2">
                Practice Projects
            </h1>

            <p class="lead text-secondary mb-0">
                Web development exercises, course projects and practice work.
            </p>
        </div>
    </header>


    <!-- Main Content -->
    <main class="container py-5">

        <!-- Project Filters -->
        <div class="project-filters mb-5">

            <button type="button" class="btn btn-dark filter-button active" data-filter="all">
                All
            </button>

            <button type="button" class="btn btn-outline-dark filter-button" data-filter="html-css">
                HTML &amp; CSS
            </button>

            <button type="button" class="btn btn-outline-dark filter-button" data-filter="bootstrap">
                Bootstrap
            </button>

            <button type="button" class="btn btn-outline-dark filter-button" data-filter="javascript">
                JavaScript
            </button>

        </div>


        <!-- Projects -->
        <section>

            <div class="row g-4">


                <!-- Module 3 -->
                <div class="col-12 col-md-6 col-lg-4 project-item" data-category="bootstrap">

                    <div class="card project-card h-100">

                        <div class="card-body d-flex flex-column">

                            <span class="badge text-bg-primary align-self-start mb-3">
                                Bootstrap
                            </span>

                            <h2 class="h5 card-title">
                                Module 3 Solution
                            </h2>

                            <p class="card-text text-secondary">
                                Responsive layout and Bootstrap component practice.
                            </p>

                            <a href="./module3-solution/" class="btn btn-dark mt-auto">
                                View Project
                            </a>

                        </div>

                    </div>

                </div>


            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="border-top bg-white">
        <div class="container py-4">
            <p class="text-secondary mb-0">
                Practice Projects · Mehmet Aytac
            </p>
        </div>
    </footer>


    <!-- Filter JavaScript -->
    <script>

        const filterButtons = document.querySelectorAll(".filter-button");
        const projectItems = document.querySelectorAll(".project-item");


        filterButtons.forEach(button => {

            button.addEventListener("click", () => {

                const selectedFilter = button.dataset.filter;


                // Update active button
                filterButtons.forEach(btn => {
                    btn.classList.remove("active");
                    btn.classList.remove("btn-dark");
                    btn.classList.add("btn-outline-dark");
                });

                button.classList.add("active");
                button.classList.remove("btn-outline-dark");
                button.classList.add("btn-dark");


                // Filter projects
                projectItems.forEach(project => {

                    const projectCategory = project.dataset.category;

                    if (
                        selectedFilter === "all" ||
                        projectCategory === selectedFilter
                    ) {
                        project.style.display = "";
                    } else {
                        project.style.display = "none";
                    }

                });

            });

        });

    </script>

</body>

</html>
